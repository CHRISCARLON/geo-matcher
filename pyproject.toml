[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usrn-matcher"
version = "0.3.0"
description = "A library to spatially join USRNs to any spatial dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-sedona[db]==1.8.1",
    "duckdb==1.5.2",
]

[project.urls]
Homepage = "https://github.com/cmcarlon/usrn-matcher"
Repository = "https://github.com/cmcarlon/usrn-matcher"

[dependency-groups]
linting = ["ruff>=0.4"]
testing = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
]
typechecking = ["mypy==1.9.0"]
dev = [
    { include-group = "linting" },
    { include-group = "testing" },
    { include-group = "typechecking" },
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["usrn_matcher"]

[project.scripts]
usrn-matcher = "usrn_matcher.matcher:UsrnMatcher.cli"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that require external data or services",
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "I001", # isort
    "B",    # bugbear
    "T20",  # flake8-print
]
ignore = [
    "B006", # mutable default arguments
    "B905", # zip() without strict=
    "E501", # line too long — ruff format can't reflow comments/docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["usrn_matcher"]

[tool.mypy]
python_version = "3.12"
packages = "usrn_matcher"
ignore_missing_imports = true
# gradual strict — opt in a rule at a time
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# not yet:
# disallow_untyped_defs = true
# disallow_any_generics = true
